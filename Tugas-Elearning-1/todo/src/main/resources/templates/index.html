<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>To-Do List</h1>

        <form action="/add" method="post" class="form-todo">
            <input type="text" name="task" placeholder="Masukkan tugas..." required>
            <input type="date" name="deadline" required>
            <button type="submit">Tambah</button>
        </form>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Tugas</th>
                        <th>Deadline</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="todo, iterStat : ${todos}">
                        <td th:text="${iterStat.index + 1}"></td>
                        <td th:text="${todo.task}" th:classappend="${todo.completed} ? 'completed' : ''"></td>
                        <td th:text="${#dates.format(todo.deadline, 'dd-MM-yyyy')}"></td>
                        <td>
                            <form th:action="@{'/update/' + ${todo.id}}" method="post" style="display:inline;">
                                <button type="submit">✔</button>
                            </form>
                            <form th:action="@{'/delete/' + ${todo.id}}" method="post" style="display:inline;">
                                <button type="submit">❌</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
